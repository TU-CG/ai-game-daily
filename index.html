<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AI Game Daily</title><link rel="preconnect" href="https://images.unsplash.com"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"/><style>
:root{--bg:#0b0b0d;--surface:#141417;--ink:#f1f1f3;--muted:#9b9ba4;--faint:#63636d;--line:#29292f;--accent:#ff7b59;--soft:#ececf0;--font:"Inter","Noto Sans SC",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}a{color:inherit}.topbar,main,footer{width:min(1160px,calc(100% - 48px));margin:auto}.topbar{height:72px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-size:15px;font-weight:700;text-decoration:none}.mark{display:flex;gap:2px;align-items:center;width:24px;transform:rotate(-25deg)}.mark i{display:block;width:5px;height:14px;border-radius:5px;background:var(--soft)}.mark i:nth-child(2){height:18px}.mark i:nth-child(3){height:10px}.topbar nav{display:flex;gap:25px;margin-right:auto}.topbar nav a{color:var(--muted);font-size:13px;text-decoration:none}.subscribe{padding:8px 13px;border-radius:7px;background:var(--soft);color:#141417;font-size:13px;font-weight:600;text-decoration:none}.head{padding:78px 0 27px;border-bottom:1px solid var(--line)}.overline{margin:0;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.08em}.head h1{margin:17px 0 15px;font-size:48px}.head>p{max-width:780px;margin:0;color:#b9b9c1;font-size:16px;line-height:1.75}.tools{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:34px}.tools span{color:var(--muted);font-size:13px}.date-control{height:39px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:12px}.date-control input{border:0;outline:0;background:transparent;color:var(--ink);font:12px var(--font);color-scheme:dark}.clear{height:39px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);font:12px var(--font);cursor:pointer}.timeline{padding:54px 0 80px}.daily{display:grid;grid-template-columns:225px minmax(0,700px);gap:52px;padding:18px 0 70px}.date{position:relative;color:var(--muted);font-size:14px}.date:after{content:"";position:absolute;left:7px;top:31px;bottom:-89px;border-left:1px solid var(--line)}.daily:last-child .date:after{display:none}.dot{display:inline-block;width:10px;height:10px;margin-right:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,123,89,.08)}.type{margin:0 0 11px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.08em}.daily h2{margin:0 0 15px;font-size:31px;line-height:1.32}.summary{margin:0;color:#c6c6cd;font-size:15px;line-height:1.8}.entry{padding:25px 0;border-top:1px solid var(--line)}.entry:first-of-type{margin-top:29px}.entry-head{display:flex;gap:13px;align-items:baseline}.number{color:var(--accent);font-size:12px}.entry h3{margin:0;font-size:20px;line-height:1.45}.entry p{margin:15px 0 0;color:#c5c5cc;font-size:15px;line-height:1.8}.entry img{display:block;width:100%;height:260px;margin-top:19px;object-fit:cover;border:1px solid var(--line);border-radius:8px;filter:saturate(.62) contrast(1.05)}.source{display:inline-block;margin-top:10px;color:#eeeef2;font-size:13px;text-decoration:none}.focus{margin:30px 0;padding:21px 23px;border-left:2px solid #8c8c98;background:#111114}.focus small,.label{color:var(--muted);font-size:12px;font-weight:600}.focus h3{margin:9px 0 6px;font-size:18px}.focus p{margin:0;color:#b5b5bd;font-size:14px;line-height:1.7}.work{margin-top:35px;padding-top:28px;border-top:1px solid var(--line)}.work h3{margin:10px 0 0;font-size:23px}.work-item{padding:20px 0;border-bottom:1px solid var(--line)}.work-item strong{font-size:15px}.work-item p{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.trend{margin-top:35px;padding:25px 28px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.trend h3{margin:8px 0 14px;font-size:21px;line-height:1.45}.trend ul{margin:0;padding-left:20px;color:#c7c7ce}.trend li{margin:8px 0;font-size:14px;line-height:1.7}.empty{padding:42px 0;color:var(--muted);font-size:14px}.about{display:grid;grid-template-columns:1fr 1fr;gap:110px;padding:60px 0 90px;border-top:1px solid var(--line)}.about h2{margin:14px 0 0;font-size:32px;line-height:1.3}.about>p{max-width:450px;margin:26px 0 0;color:var(--muted);font-size:15px;line-height:1.8}footer{min-height:84px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);color:var(--faint);font-size:12px}@media(max-width:760px){.topbar,main,footer{width:calc(100% - 32px)}.topbar{height:64px}.topbar nav{display:none}.head{padding-top:54px}.head h1{font-size:34px}.head>p{font-size:14px}.tools{align-items:stretch;flex-direction:column}.date-control input{width:100%}.daily{grid-template-columns:1fr;gap:19px;padding-bottom:54px}.date{font-size:13px}.date:after{left:4px;top:28px;bottom:-75px}.dot{width:8px;height:8px;margin-right:9px}.content{padding-left:17px}.daily h2{font-size:26px}.entry h3{font-size:19px}.entry img{height:205px}.about{grid-template-columns:1fr;gap:18px;padding:52px 0 64px}.about h2{font-size:28px}.about>p{margin:0}footer{min-height:108px;align-items:flex-start;flex-direction:column;justify-content:center;gap:8px}}
</style></head><body><header class="topbar"><a class="brand" href="#top"><span class="mark"><i></i><i></i><i></i></span>AI Game Daily</a><nav><a href="#reports">日报</a><a href="#about">关于</a></nav><a class="subscribe" href="#about">订阅更新</a></header><main id="top"><section class="head"><p class="overline">AI GAME INDUSTRY INTELLIGENCE</p><h1>每日 AI 游戏综合日报</h1><p>追踪生成式 AI 如何进入游戏制作、产品体验和研发协作。每个日期是一个日报节点，节点内聚合当天全部动态。</p><div class="tools"><span id="status">展示全部历史日报</span><div><label class="date-control">按日期查找 <input id="date-input" type="date" aria-label="按日期查找日报"/></label> <button class="clear" id="clear" hidden>查看全部</button></div></div></section><section class="timeline" id="reports"><div id="list"></div></section><section class="about" id="about"><div><p class="overline">ABOUT THIS REPORT</p><h2>每天一份，<br/>只留下重要变化。</h2></div><p>日期选择会直接定位当天日报，而不会拆散一天内的多条动态。自动任务添加新日报后，会以同样的结构进入时间线。</p></section></main><footer><span>AI Game Daily</span><span>更新于 2026.07.22</span><span>Built for game makers</span></footer><script>
const reports=[{date:'2026-07-22',title:'每日 AI 游戏综合日报',summary:'过去 24 小时的可核验信号集中在游戏引擎的 AI 协作接口、以自有素材训练的生成式游戏实践，以及研发代理的长期协作能力。本轮仅确认三项高质量动态，未以旧闻或赞助稿凑足五条。',items:[{title:'Unity 7 将延续 Unity 6 架构，并把 AI 协作接入引擎工具链',image:'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1400&q=85',text:['Unity 公布下一代引擎路线。GamesIndustry.biz 报道称，Unity 7 将承接 Unity 6 的架构与现有工作流，并提供命令行工具、公开 API，以及用于连接 AI 编程代理的免费 MCP；团队可自行决定是否采用 AI 工具。','这意味着 AI 正从编辑器内的单点功能转向跨美术、制作与开发工具的协作层。'],url:'https://www.gamesindustry.biz/unity-7-to-launch-in-q1-2027-new-engine-is-a-direct-continuation-of-unity-6'},{title:'Studio Atelico 将自有素材训练与在端生成式能力放入首款游戏验证',text:['Studio Atelico 正以回合制生物对战游戏 Bobium Brawlers 验证其 AI-first 生态。公司称模型训练使用本工作室艺术家的作品、可在设备端运行，且正在起草创作者权利协议以限制训练和使用范围并参与收益。','上述训练、授权与产品效果均为公司说法，尚无独立审计结果。这提供了一个把生成式内容、数据来源与创作者授权一并纳入生产流程的具体案例。'],url:'https://www.gamesindustry.biz/ethical-low-power-and-on-device-studio-atelicos-vision-for-the-future-of-generative-ai'},{title:'Codex 0.145.0 强化跨会话与多代理研发协作',text:['OpenAI 在 Codex 官方仓库发布 0.145.0，加入可恢复、搜索与持久化的任务历史，并扩展了外部工具设置、MCP、插件、会话与项目记忆的导入。选择加入的多代理模式也支持配置子代理模型、推理级别与并发度。','这类能力使研发代理更适合在复杂项目的长期上下文、工具目录和任务历史中持续协作。'],url:'https://github.com/openai/codex/releases/tag/rust-v0.145.0'}],focus:{title:'Unity 7 的工具链路线最值得关注。',body:'它将命令行、公开 API 和代理连接点纳入主流游戏引擎演进，并保留团队的采用选择权，可能比单个生成模型更快影响日常制作协作。'},trend:true},{date:'2026-07-21',title:'AI NPC 的下一步，是从对话展示走向行为系统',summary:'关注角色记忆、行为反馈与游戏规则之间的约束关系。',items:[],focus:{title:'角色是否可信，取决于它能否在规则内做出持续选择。',body:'对话只是入口，行为层与世界规则的约束才是长期体验的核心。'}},{date:'2026-07-20',title:'美术生产中的 AI 协作，开始从草图扩展至资产管理',summary:'团队更关心风格一致性和资产溯源，而非单张图的效果。',items:[],focus:{title:'规模化之前，先解决资产的一致性与可追溯性。',body:'工具能力必须对接资产规范，才能真正进入生产流程。'}}];
const dateText=d=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date(d+'T00:00:00'));const list=document.querySelector('#list');const input=document.querySelector('#date-input');input.min='2026-07-20';input.max='2026-07-22';function render(){const shown=reports.filter(r=>!input.value||r.date===input.value);list.replaceChildren(...shown.map(r=>{const article=document.createElement('article');article.className='daily';const entries=r.items.map((item,index)=>'<section class="entry"><div class="entry-head"><span class="number">'+String(index+1).padStart(2,'0')+'</span><h3>'+item.title+'</h3></div>'+(item.image?'<img src="'+item.image+'" alt="游戏设备与控制器"/>':'')+item.text.map(t=>'<p>'+t+'</p>').join('')+'<a class="source" target="_blank" rel="noreferrer" href="'+item.url+'">查看原始链接 ↗</a></section>').join('');const work=r.trend?'<section class="work"><p class="label">AI R&D WORKFLOW</p><h3>研发协作的两个新连接点</h3><div class="work-item"><strong>Unity 7：引擎工具链连接</strong><p>命令行、公开 API 与 MCP 连接点组合，便于把资产检查、生产管理和编码代理放入同一工作流。</p></div><div class="work-item"><strong>Codex 0.145.0：长期协作基础</strong><p>以可恢复历史、持久记忆和可配置多代理为核心，适合跨任务追踪与长期协作。</p></div></section><section class="trend"><p class="label">TODAY\'S TREND</p><h3>AI 正从“生成一个结果”转向“进入受约束、可协作的生产系统”。</h3><ul><li>游戏引擎开始开放面向外部工具和代理的接口。</li><li>生成式内容的竞争点延伸到训练来源、设备端部署与创作者授权。</li><li>研发代理的价值重心转向项目记忆、可恢复上下文与多代理编排。</li></ul></section>':'';article.innerHTML='<aside class="date"><span class="dot"></span>'+dateText(r.date)+'</aside><div class="content"><p class="type">DAILY REPORT</p><h2>'+r.title+'</h2><p class="summary">'+r.summary+'</p>'+entries+'<div class="focus"><small>今日判断</small><h3>'+r.focus.title+'</h3><p>'+r.focus.body+'</p></div>'+work+'</div>';return article}));if(!shown.length)list.innerHTML='<p class="empty">这一天没有日报内容。</p>';const isDate=Boolean(input.value);document.querySelector('#clear').hidden=!isDate;document.querySelector('#status').textContent=isDate?'已定位至 '+dateText(input.value)+' 的日报':'展示全部历史日报'}input.addEventListener('change',render);document.querySelector('#clear').addEventListener('click',()=>{input.value='';render()});render();
</script></body></html>
