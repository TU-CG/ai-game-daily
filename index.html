<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日 AI 游戏综合日报">
  <title>AI Game Daily</title>
  <style>
    :root{--bg:#0c0c0e;--surface:#151518;--ink:#f5f4f2;--muted:#a9a9b2;--faint:#74747c;--line:#2a2a30;--signal:#d8ff5f;--accent:#ff7968;--max:1160px;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6}a{color:inherit}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - var(--max))/2));gap:24px}.brand{font-size:14px;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}.mark{display:flex;gap:2px}.mark i{display:block;width:4px;height:15px;background:var(--signal)}.mark i:nth-child(2){height:10px;align-self:flex-end}.mark i:nth-child(3){height:6px;align-self:flex-end;background:var(--accent)}nav{display:flex;gap:22px}nav a{font-size:13px;color:var(--muted);text-decoration:none}.subscribe{color:var(--bg);background:var(--signal);font-size:12px;font-weight:700;text-decoration:none;padding:7px 10px;border-radius:4px}.shell{max-width:var(--max);margin:auto;padding:0 24px}.head{padding:76px 0 30px;border-bottom:1px solid var(--line)}.overline,.label,.type{margin:0;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.08em}.head h1{margin:16px 0 14px;font-size:48px;line-height:1.1;letter-spacing:0}.head>p:not(.overline){max-width:790px;margin:0;color:#c1c1c8;font-size:16px;line-height:1.8}.tools{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:34px}.tools span{color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;align-items:center}.date-control{height:39px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted);font-size:12px}.date-control input{border:0;outline:0;background:transparent;color:var(--ink);font:12px var(--font);color-scheme:dark}.clear{height:39px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);font:12px var(--font);cursor:pointer}.timeline{padding:54px 0 80px}.daily{display:grid;grid-template-columns:225px minmax(0,700px);gap:52px;padding:18px 0 70px}.date{position:relative;color:var(--muted);font-size:14px}.dot{display:inline-block;width:8px;height:8px;margin-right:12px;background:var(--signal);border-radius:50%;vertical-align:middle}.content h2{margin:8px 0 12px;font-size:28px;line-height:1.22}.summary{margin:0 0 38px;color:#c5c5cc;font-size:16px;line-height:1.8}.entry{padding:28px 0;border-top:1px solid var(--line)}.entry-head{display:flex;align-items:flex-start;gap:15px}.number{padding-top:4px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.08em}.entry h3,.focus h3,.work h3,.trend h3{margin:0;font-size:19px;line-height:1.4}.entry p,.focus p,.work p,.trend li{color:#c0c0c8;font-size:15px;line-height:1.8}.entry img{display:block;width:100%;max-height:360px;object-fit:cover;margin:22px 0 4px;border-radius:4px;filter:saturate(.85)}.source{display:inline-block;margin-top:7px;color:var(--signal);font-size:13px;text-decoration:none}.focus{margin-top:34px;padding:25px 27px;border-left:2px solid var(--signal);background:var(--surface)}.focus small{color:var(--signal);font-size:11px;font-weight:700;letter-spacing:.08em}.focus h3{margin-top:8px}.focus p{margin:9px 0 0}.work,.trend{margin-top:34px;padding-top:28px;border-top:1px solid var(--line)}.work h3,.trend h3{margin-top:7px}.work-item{padding:18px 0;border-bottom:1px solid var(--line)}.work-item strong{font-size:14px}.work-item p{margin:7px 0 0}.trend ul{margin:14px 0 0;padding-left:18px}.empty{color:var(--muted);padding:30px 0}.about{display:grid;grid-template-columns:1fr 1fr;gap:55px;border-top:1px solid var(--line);padding:70px 0 76px}.about h2{margin:13px 0 0;font-size:32px;line-height:1.25}.about>p{margin:0;color:var(--muted);font-size:15px;line-height:1.9}footer{max-width:var(--max);margin:auto;padding:20px 24px;border-top:1px solid var(--line);color:var(--faint);display:flex;justify-content:space-between;gap:20px;font-size:12px}@media(max-width:720px){.topbar{padding:0 18px}.topbar nav,.subscribe{display:none}.shell{padding:0 18px}.head{padding-top:55px}.head h1{font-size:36px}.tools,.about{display:block}.controls{margin-top:17px}.daily{display:block;padding-bottom:48px}.date{margin-bottom:18px}.content h2{font-size:25px}.about h2{font-size:28px}.about>p{margin-top:23px}footer{padding:18px;flex-wrap:wrap}.entry img{max-height:260px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="#top"><span class="mark"><i></i><i></i><i></i></span>AI Game Daily</a><nav><a href="#reports">日报</a><a href="#about">关于</a></nav><a class="subscribe" href="#about">订阅更新</a></header>
  <main id="top"><div class="shell">
    <section class="head"><p class="overline">AI GAME INDUSTRY INTELLIGENCE</p><h1>每日 AI 游戏综合日报</h1><p>追踪生成式 AI 如何进入游戏制作、产品体验和研发协作。每个日期是一个日报节点，节点内聚合当天全部动态。</p><div class="tools"><span id="status">正在加载日报目录</span><div class="controls"><label class="date-control">按日期查找 <input id="date-input" type="date" aria-label="按日期查找日报"></label><button class="clear" id="clear" type="button" hidden>查看近期</button></div></div></section>
    <section class="timeline" id="reports" aria-live="polite"><p class="empty">正在加载日报...</p></section>
    <section class="about" id="about"><div><p class="overline">ABOUT THIS REPORT</p><h2>每天一份，<br>只留下重要变化。</h2></div><p>日报目录与每日正文分开保存。首页默认加载近期内容；选择一个日期时，只读取该日的完整日报。</p></section>
  </div></main>
  <footer><span>AI Game Daily</span><span id="updated">日报目录加载中</span><span>Built for game makers</span></footer>
  <script>
    const list=document.querySelector('#reports'),input=document.querySelector('#date-input'),status=document.querySelector('#status'),clear=document.querySelector('#clear'),updated=document.querySelector('#updated');
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const dateText=date=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date(date+'T00:00:00'));
    let directory={reports:[],defaultLimit:14};
    const fetchJson=async path=>{const response=await fetch(path,{cache:'no-cache'});if(!response.ok)throw new Error(path);return response.json()};
    const itemHtml=(item,index)=>{const image=item.image?'<img src="'+escapeHtml(item.image)+'" alt="'+escapeHtml(item.imageAlt||'日报配图')+'">':'';const paragraphs=(item.paragraphs||[]).map(paragraph=>'<p>'+escapeHtml(paragraph)+'</p>').join('');return '<section class="entry"><div class="entry-head"><span class="number">'+String(index+1).padStart(2,'0')+'</span><h3>'+escapeHtml(item.title)+'</h3></div>'+image+paragraphs+'<a class="source" target="_blank" rel="noreferrer" href="'+escapeHtml(item.url)+'">查看原始链接 ↗</a></section>'};
    const articleHtml=report=>{const items=(report.items||[]).map(itemHtml).join('');const focus=report.focus?'<div class="focus"><small>今日判断</small><h3>'+escapeHtml(report.focus.title)+'</h3><p>'+escapeHtml(report.focus.body)+'</p></div>':'';const workflow=report.workflow?'<section class="work"><p class="label">AI R&D WORKFLOW</p><h3>'+escapeHtml(report.workflow.title)+'</h3>'+(report.workflow.items||[]).map(item=>'<div class="work-item"><strong>'+escapeHtml(item.heading)+'</strong><p>'+escapeHtml(item.body)+'</p></div>').join('')+'</section>':'';const trend=report.trend?'<section class="trend"><p class="label">TODAYS TREND</p><h3>'+escapeHtml(report.trend.title)+'</h3><ul>'+(report.trend.points||[]).map(point=>'<li>'+escapeHtml(point)+'</li>').join('')+'</ul></section>':'';return '<article class="daily"><aside class="date"><span class="dot"></span>'+dateText(report.date)+'</aside><div class="content"><p class="type">DAILY REPORT</p><h2>'+escapeHtml(report.title)+'</h2><p class="summary">'+escapeHtml(report.summary)+'</p>'+items+focus+workflow+trend+'</div></article>'};
    async function render(date=''){const records=date?directory.reports.filter(report=>report.date===date):directory.reports.slice(0,directory.defaultLimit||14);clear.hidden=!date;if(!records.length){list.innerHTML='<p class="empty">这一天没有日报内容。</p>';status.textContent='未找到该日期的日报';return}status.textContent=date?'已定位至 '+dateText(date)+' 的日报':'展示最近 '+records.length+' 份日报';list.innerHTML='<p class="empty">正在加载日报...</p>';try{const reports=await Promise.all(records.map(record=>fetchJson('data/'+record.file)));list.innerHTML=reports.map(articleHtml).join('')}catch(error){list.innerHTML='<p class="empty">日报内容暂时无法加载，请稍后刷新页面。</p>';status.textContent='日报内容加载失败'}}
    async function init(){try{directory=await fetchJson('data/reports.json');directory.reports=(directory.reports||[]).sort((a,b)=>b.date.localeCompare(a.date));const dates=directory.reports.map(report=>report.date);if(!dates.length)throw new Error('empty');input.min=dates[dates.length-1];input.max=dates[0];updated.textContent='更新于 '+dates[0].replaceAll('-','.');await render()}catch(error){list.innerHTML='<p class="empty">日报目录暂时无法加载，请稍后刷新页面。</p>';status.textContent='日报目录加载失败';updated.textContent='暂未加载日报目录'}}
    input.addEventListener('change',()=>render(input.value));clear.addEventListener('click',()=>{input.value='';render()});init();
  </script>
</body>
</html>
